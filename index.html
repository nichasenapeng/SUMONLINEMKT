<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard ยอดขายออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#f3f4f6}
  body{font-family:'Sarabun','Kanit',sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:40px 34px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.06);text-align:center}
  .lock{font-size:44px;margin-bottom:10px}
  h1{font-family:'Kanit',sans-serif;font-size:20px;font-weight:700;color:#111827;margin-bottom:4px}
  .sub{font-size:13.5px;color:#6b7280;margin-bottom:24px}
  input{width:100%;padding:13px 16px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:'Sarabun',sans-serif;font-size:15px;outline:none;transition:border .15s;margin-bottom:12px}
  input:focus{border-color:#111827}
  button{width:100%;padding:13px;background:#111827;color:#fff;border:none;border-radius:10px;font-family:'Kanit',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
  button:hover{background:#374151}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#dc2626;font-size:13px;margin-top:12px;min-height:18px;font-family:'Kanit',sans-serif}
  .shake{animation:sh .4s}
  @keyframes sh{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="off">
    <div class="lock">🔒</div>
    <h1>Dashboard ยอดขายออนไลน์</h1>
    <div class="sub">กรุณาใส่รหัสผ่านเพื่อเข้าดู</div>
    <input type="password" id="pw" placeholder="รหัสผ่าน" autofocus>
    <button type="submit" id="btn">เข้าสู่ระบบ</button>
    <div class="err" id="err"></div>
  </form>

const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  return new TextDecoder().decode(pt);
}
function show(html){ try{sessionStorage.setItem('dbAuth','1')}catch(e){} document.open(); document.write(html); document.close(); }
const f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('btn'),card=f;
f.addEventListener('submit',async e=>{
  e.preventDefault(); const pw=document.getElementById('pw').value; if(!pw)return;
  btn.disabled=true; btn.textContent='กำลังตรวจสอบ...'; err.textContent='';
  try{ const html=await unlock(pw); show(html); }
  catch(ex){ err.textContent='รหัสผ่านไม่ถูกต้อง ลองอีกครั้ง'; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); btn.disabled=false; btn.textContent='เข้าสู่ระบบ'; document.getElementById('pw').select(); }
});
</script>
